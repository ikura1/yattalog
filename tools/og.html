<!doctype html>
<!-- リンクのプレビュー用の画像（og.png、1200×630）の元。tools/build_icons.py が、これを画像にする -->
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #EEF1F6; color: #1B2333; display: flex; align-items: center; gap: 64px; padding: 0 88px; box-sizing: border-box;
         font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; }
  .icon { width: 300px; height: 300px; flex: none; border-radius: 22%; overflow: hidden; box-shadow: 0 12px 40px rgba(17, 24, 39, .16); }
  .icon svg { display: block; width: 100%; height: 100%; }
  h1 { font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 800; font-size: 96px; line-height: 1; margin: 0 0 28px; letter-spacing: .01em; }
  h1 b { color: #1F6F5C; font-weight: 800; }
  .ask { font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 800; font-size: 50px; line-height: 1.3; margin: 0 0 18px; }
  .sub { font-size: 30px; font-weight: 500; color: #4A5568; margin: 0; line-height: 1.5; }
</style></head>
<body>
  <div class="icon"><!--ICON--></div>
  <div>
    <h1>Yatta<b>log</b></h1>
    <p class="ask">前にやったの、いつだっけ？</p>
    <p class="sub">やったら1タップ。<br>前回からの日数が、ひと目でわかる。</p>
  </div>
</body></html>
