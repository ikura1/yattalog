<title>Yattalog PoC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: スマホ1画面アプリ。上部バー＋3列タイルグリッド。詳細はフルスクリーンパネル、入力はボトムシート */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --fg:#1B2333; --muted:#667085; --line:#D8DEE8;
  --accent:#1F6F5C; --accent-fg:#FFFFFF; --danger:#C2362B; --toast:#1B2333; --toast-fg:#F4F6FA;
  --scrim:rgba(17,24,39,.42); --shadow:0 1px 2px rgba(17,24,39,.08),0 6px 18px rgba(17,24,39,.06);
  --t-tomato:#FFD9D2; --t-tangerine:#FFE3C2; --t-sun:#FFF1B8; --t-leaf:#D7F0C8;
  --t-teal:#C9EEE6; --t-sky:#D3E6FF; --t-grape:#E4DAFF; --t-pink:#FFDCEB;
  --tile-fg:#1B2333; --dot:#1F6F5C;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161E; --surface:#1B212C; --fg:#E8ECF3; --muted:#98A2B3; --line:#2C3442;
  --accent:#5CC9A7; --accent-fg:#0E1A16; --danger:#FF7B6E; --toast:#E8ECF3; --toast-fg:#12161E;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4);
  --t-tomato:#4A2A27; --t-tangerine:#4A3522; --t-sun:#463E1E; --t-leaf:#2A3F25;
  --t-teal:#1F3F3A; --t-sky:#22344D; --t-grape:#35294F; --t-pink:#4A2638;
  --tile-fg:#EEF1F6; --dot:#5CC9A7; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161E; --surface:#1B212C; --fg:#E8ECF3; --muted:#98A2B3; --line:#2C3442;
  --accent:#5CC9A7; --accent-fg:#0E1A16; --danger:#FF7B6E; --toast:#E8ECF3; --toast-fg:#12161E;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4);
  --t-tomato:#4A2A27; --t-tangerine:#4A3522; --t-sun:#463E1E; --t-leaf:#2A3F25;
  --t-teal:#1F3F3A; --t-sky:#22344D; --t-grape:#35294F; --t-pink:#4A2638;
  --tile-fg:#EEF1F6; --dot:#5CC9A7; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:8px 120px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding-block:10px;background:var(--bg)}
.logo{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.01em;margin:0;flex:1}
.logo b{color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.pill.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.iconbtn{border:none;background:transparent;width:40px;height:40px;border-radius:12px;font-size:20px;display:grid;place-items:center}
.poc-note{font-size:12px;color:var(--muted);margin:0 0 12px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:4;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button .n{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs button[aria-selected=true] .n{color:var(--bg);opacity:.7}
.tabs .tab-add{width:36px;justify-content:center;padding:7px 0;color:var(--muted)}
.tab-empty{margin-top:12px}
.slide-l{animation:sl .22s ease-out}.slide-r{animation:sr .22s ease-out}
@keyframes sl{from{transform:translateX(24px);opacity:.4}}@keyframes sr{from{transform:translateX(-24px);opacity:.4}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.chips button[aria-checked=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips .chip-new{border-style:dashed;color:var(--muted);background:transparent}
.inline-new{display:flex;gap:6px;align-items:center;width:100%;margin-top:4px}
.inline-new input{flex:1;min-width:0}
.catlist{list-style:none;margin:0 0 12px;padding:0}
.catlist li{display:flex;align-items:center;gap:4px;padding:6px 0;border-top:1px solid var(--line)}
.catlist li:first-child{border-top:none}
.catlist input{flex:1;min-width:0}
.catlist .cnt{font-size:12px;color:var(--muted);white-space:nowrap;padding:0 4px}
.iconbtn:disabled{opacity:.3}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;aspect-ratio:1/1.08;max-width:100%;border-radius:var(--r);background:var(--tc,var(--surface));color:var(--tile-fg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:20px 8px 10px;border:none;width:100%;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .18s ease}
.tile .emo{font-size:30px;line-height:1.1}
.tile .name{font-size:12.5px;font-weight:700;text-align:center;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;word-break:break-all}
.tile .ago{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .ago small{font-size:12px;font-weight:700;margin-left:1px}
.tile .ago.never{font-size:14px;opacity:.6}
.tile.today .ago{color:var(--accent)}
.streak{position:absolute;top:6px;right:6px;font-family:var(--f-display);font-weight:800;font-size:12px;line-height:1;padding:3px 6px 3px 4px;border-radius:999px;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.streak small{font-size:10px;margin-left:1px}
.streak.pending{color:var(--muted)}
.streak.pending .fire{filter:grayscale(1);opacity:.55}
.streak.burst{animation:burst .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes burst{0%{transform:scale(.4) rotate(-15deg)}60%{transform:scale(1.35) rotate(6deg)}100%{transform:scale(1)}}
.tile.pressing{transform:scale(.93)}
.tile.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.9)}100%{transform:scale(1)}}
.tile.add{background:transparent;border:2px dashed var(--line);color:var(--muted);font-size:13px;font-weight:700}
.tile.add .emo{font-size:28px}
/* edit mode */
.editing .tile:not(.add){animation:wig .32s ease-in-out infinite alternate;touch-action:none}
.editing .tile:not(.add):nth-child(2n){animation-delay:-.16s}
@keyframes wig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.tile .x{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;border:none;background:var(--fg);color:var(--bg);font-size:14px;font-weight:700;display:none;place-items:center;line-height:1}
.editing .tile .x{display:grid}
.tile.dragging{opacity:.35;animation:none}
.ghost{position:fixed;pointer-events:none;z-index:50;transform:scale(1.08);box-shadow:0 12px 30px rgba(0,0,0,.25);animation:none!important}
.edit-hint{font-size:13px;color:var(--muted);margin:0 0 10px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--toast);color:var(--toast-fg);
  border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:6px;width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast p{margin:0;flex:1;font-weight:700;font-size:14px;min-width:0}
.toast button{border:none;background:transparent;color:var(--toast-fg);font-weight:700;padding:6px 10px;border-radius:8px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.toast .bar5{position:absolute;left:12px;right:12px;bottom:4px;height:2px;border-radius:2px;background:var(--toast-fg);opacity:.35;transform-origin:left;animation:shrink 5s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:39;width:min(560px,calc(100% - 32px));
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:14px}
.hint p{margin:0;flex:1}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:22px 22px 0 0;max-height:88%;overflow:auto;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--f-display);font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
input[type=text],input[type=datetime-local],textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;flex:1;min-width:120px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.small{flex:0 0 auto;min-width:0;padding:7px 12px;font-size:13px}
.links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;font-weight:700;font-size:14px}
.seg button[aria-checked=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pickbox{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px;margin-top:8px}
.pf{display:flex;flex-direction:column;gap:4px;min-width:0}
.pf label{font-size:12px;color:var(--muted);font-weight:700}
input[type=date],input[type=time]{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
.whenNote{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.cal button:disabled{opacity:.3;cursor:default}
.photo-prev{max-height:160px;border-radius:12px;display:block;margin-top:6px}
.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.emojis button{border:1px solid transparent;background:var(--bg);border-radius:10px;font-size:22px;aspect-ratio:1;padding:0}
.emojis button[aria-pressed=true]{border-color:var(--accent);background:var(--surface)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line)}
.colors button[aria-pressed=true]{border:3px solid var(--fg)}

/* detail panel */
.panel{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-block:env(safe-area-inset-top,0px) calc(40px + env(safe-area-inset-bottom,0px))}
.panel .in{max-width:720px;margin:0 auto;padding-inline:16px}
.hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--tc);color:var(--tile-fg);margin-bottom:14px}
.hero .emo{font-size:44px}
.hero h2{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.3;text-wrap:balance;word-break:break-all}
.hero .sub{font-size:13px;opacity:.8}
.hero .big{margin-left:auto;text-align:right;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;white-space:nowrap}
.hero .big small{font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px;min-width:0}
.stat .k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .v small{font-size:12px;font-weight:700}
.card{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head strong{font-family:var(--f-display);font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-variant-numeric:tabular-nums}
.cal .dow{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal button{border:none;background:transparent;aspect-ratio:1;border-radius:50%;font-size:13px;position:relative;padding:0}
.cal button.has{background:var(--dot);color:var(--accent-fg);font-weight:700}
.cal button.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cal button.sel{outline:2px solid var(--fg);outline-offset:1px}
.cal .pad{visibility:hidden}
.logs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.logs li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.logs li:first-child{border-top:none}
.logs .when{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
.logs .body{flex:1;min-width:0}
.logs .c{white-space:pre-wrap;word-break:break-word;font-size:14px;color:var(--fg)}
.logs .c.empty{color:var(--muted)}
.logs img{max-width:120px;border-radius:10px;margin-top:6px;display:block}
.logs .ops{display:flex;gap:4px}
.empty{color:var(--muted);font-size:14px;margin:0}

/* season chart */
.season-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg2{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg2 button{border:none;background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.seg2 button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.season-sub{margin:6px 0 0;font-size:13px;color:var(--muted)}
.season-n{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700}
.season-line{margin:4px 0 6px;font-size:14px}
.season-line b{font-family:var(--f-display);color:var(--accent);font-size:16px}
.season-chart{position:relative}
.season-chart svg{width:100%;height:auto;display:block;overflow:visible}
.sgrid{stroke:var(--line);stroke-width:1}
.sgrid.base{stroke:var(--muted);stroke-opacity:.5}
.sax{fill:var(--muted);font-size:10px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.sax.fut{opacity:.4}
.sval{fill:var(--fg);font-size:11px;font-weight:700;font-family:var(--f-display)}
.sbar{fill:var(--accent);fill-opacity:.55;stroke:var(--accent);stroke-width:0}
.sbar[data-v="0"]{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round}
.sbar.peak{fill-opacity:1}
.sbar.on{fill-opacity:1;stroke:var(--fg);stroke-width:1.5}
.shit{fill:transparent;cursor:pointer;outline:none}
.shit:focus-visible{fill:var(--line);fill-opacity:.4}
.tipping .sval{opacity:0}
.season-tip{position:absolute;top:0;transform:translate(-50%,-100%);background:var(--toast);color:var(--toast-fg);font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* share */
.share-prev{display:grid;place-items:center;margin-bottom:10px}
.share-prev img{width:min(260px,70%);aspect-ratio:1080/1350;border-radius:14px;box-shadow:var(--shadow);background:var(--bg)}
.share-opts{display:flex;flex-direction:column;gap:2px}
.share-opts .check{margin-bottom:4px}
a.btn{display:block;text-align:center;text-decoration:none;color:var(--fg)}
.pill:disabled{opacity:.4}
/* login mock */
.login .in{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:32px}
.login-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.login-tiles{display:flex;gap:10px;margin-bottom:6px}
.login-tiles span{background:var(--tc);color:var(--tile-fg);border-radius:16px;width:76px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px}
.login-tiles b{font-family:var(--f-display);font-size:15px}
.login-tiles span:nth-child(2){transform:translateY(-8px) rotate(3deg)}
.login-tiles span:nth-child(1){transform:rotate(-4deg)}
.login-copy{margin:0;color:var(--muted);font-size:15px;line-height:1.8}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:400px;margin:0 auto;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.login-legal{font-size:12px;color:var(--muted);text-align:center;margin:0}
/* onboarding */
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tpl{display:flex;align-items:center;gap:8px;border:2px solid transparent;background:var(--tc);color:var(--tile-fg);border-radius:14px;padding:10px;text-align:left;font-weight:700;font-size:14px;min-width:0}
.tpl .emo{font-size:22px}
.tpl[aria-pressed=true]{border-color:var(--fg)}
.tpl .chk{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:12px;flex:none}
.tpl[aria-pressed=true] .chk{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:14px}
.menu{list-style:none;margin:0;padding:0}
.menu button{width:100%;text-align:left;border:none;background:transparent;padding:13px 4px;border-top:1px solid var(--line);font-weight:500}
.menu li:first-child button{border-top:none}
.arch{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header class="bar">
    <h1 class="logo">Yatta<b>log</b></h1>
    <button class="pill" id="editBtn" type="button">編集</button>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="メニュー">⋯</button>
  </header>
  <p class="poc-note">PoC v0.7 ・ データはこの端末のブラウザにだけ保存されます</p>
  <p class="edit-hint" id="editHint" hidden>ドラッグで並べ替え ・ タップで詳細 ・ ×でアーカイブ／削除</p>
  <nav class="tabs" id="tabs" role="tablist" aria-label="カテゴリ"></nav>
  <ul class="grid" id="grid" role="tabpanel"></ul>
  <p class="empty tab-empty" id="tabEmpty" hidden></p>
</div>
<div id="layer"></div>

<script>
(() => {
const TZ = "Asia/Tokyo";
const COLORS = ["tomato","tangerine","sun","leaf","teal","sky","grape","pink"];
const EMOJIS = ["🛏️","✂️","🌀","🚲","🧗","🦷","🚗","🪴","📞","🏋️","🧺","🧹","🍳","💊","🐈","🛁","🧴","🔋","📚","🎸","🏃","💇","🧽","🗑️"];
const TEMPLATES = [
  {name:"シーツ交換",unit:"week",cat:"家事",emoji:"🛏️",color:"sky",every:7},
  {name:"エアコンのフィルター掃除",unit:"month",cat:"家事",emoji:"🌀",color:"teal",every:30},
  {name:"散髪",unit:"month",cat:"身の回り",emoji:"✂️",color:"grape",every:35},
  {name:"歯医者",unit:"none",cat:"身の回り",emoji:"🦷",color:"pink",every:120},
  {name:"洗車",unit:"month",cat:"身の回り",emoji:"🚗",color:"tangerine",every:30},
  {name:"換気扇の掃除",unit:"none",cat:"家事",emoji:"🧽",color:"sun",every:90},
  {name:"布団を干す",unit:"week",cat:"家事",emoji:"🧺",color:"leaf",every:10},
  {name:"植物の水やり",unit:"day",cat:"家事",emoji:"🪴",color:"leaf",every:1},
  {name:"実家に連絡",unit:"week",cat:"身の回り",emoji:"📞",color:"tomato",every:14},
  {name:"ジム",unit:"day",cat:"趣味",emoji:"🏋️",color:"tangerine",every:3},
  {name:"自転車のチェーン注油",unit:"month",cat:"趣味",emoji:"🚲",color:"teal",every:21},
  {name:"ボルダリング",unit:"week",cat:"趣味",emoji:"🧗",color:"sun",every:4},
];
const KEY = "yattalog-poc-v1";
let S = load();
let editing = false;
let toastTimer = null;

function load(){
  let d = null;
  try{ const raw = localStorage.getItem(KEY); if(raw) d = JSON.parse(raw); }catch(e){}
  return migrate(d || fresh(false));
}
function fresh(onboarded){ return {events:[],logs:[],categories:[],meta:{onboarded,hintShown:false,tab:"all"}}; }
function migrate(d){ d.categories ||= []; d.meta ||= {}; d.meta.tab ||= "all"; d.events.forEach(e=>{ if(e.categoryId===undefined) e.categoryId=null; if(!e.streakUnit) e.streakUnit="day"; }); return d;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ showToast("保存できませんでした（写真が大きすぎる可能性があります）"); return false; }
}
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---- dates (Asia/Tokyo calendar days) ---- */
const dfmt = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
const dayKey = ms => dfmt.format(new Date(ms));                // "2026-10-10"
const dayNum = ms => { const [y,m,d] = dayKey(ms).split("-").map(Number); return Date.UTC(y,m-1,d)/864e5; };
const daysSince = ms => dayNum(Date.now()) - dayNum(ms);
function parts(ms){ const o={}; new Intl.DateTimeFormat("en-US",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(ms)).forEach(p=>o[p.type]=p.value); if(o.hour==="24")o.hour="00"; return o; }
function fmtWhen(ms, noTime=false){ const p=parts(ms), now=parts(Date.now()); return (p.year===now.year?"":p.year+"/")+`${p.month}/${p.day}`+(noTime?"":` ${p.hour}:${p.minute}`); }
const todayKey = () => dayKey(Date.now());
function shiftDay(key, n){ const [y,m,d]=key.split("-").map(Number); const t=new Date(Date.UTC(y,m-1,d+n)); return t.toISOString().slice(0,10); }
const noonOf = key => new Date(key+"T12:00:00+09:00").getTime();
function relDayLabel(key){ const t=todayKey(); if(key===t) return "今日"; if(key===shiftDay(t,-1)) return "昨日"; if(key===shiftDay(t,-2)) return "一昨日"; return `${+key.slice(5,7)}月${+key.slice(8)}日`; }
function toLocalInput(ms){ const p=parts(ms); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`; }
function fromLocalInput(v){ return new Date(v+":00+09:00").getTime(); }
function agoParts(ms){
  if(ms==null) return null;
  const d = daysSince(ms);
  if(d<=0) return {n:"今日",u:""};
  if(d<60) return {n:d,u:"日"};
  if(d<730) return {n:Math.floor(d/30),u:"か月"};
  return {n:Math.floor(d/365),u:"年"};
}
function friendlyInterval(days){
  if(days<1.5) return "ほぼ毎日";
  if(days<10) return `だいたい${Math.round(days)}日ごと`;
  if(days<45) return `だいたい${Math.round(days/7)}週間ごと`;
  if(days<365) return `だいたい${Math.round(days/30)}か月ごと`;
  return `だいたい${Math.round(days/365)}年ごと`;
}

/* ---- data helpers ---- */
const active = () => S.events.filter(e=>!e.archived).sort((a,b)=>a.order-b.order);
const logsOf = id => S.logs.filter(l=>l.eventId===id).sort((a,b)=>b.doneAt-a.doneAt);
const cats = () => [...S.categories].sort((a,b)=>a.order-b.order);
const curTab = () => (S.meta.tab==="all" || S.categories.some(c=>c.id===S.meta.tab)) ? S.meta.tab : "all";
const visible = () => { const t=curTab(); return t==="all" ? active() : active().filter(e=>e.categoryId===t); };
function ensureCat(name){ let c=S.categories.find(x=>x.name===name); if(!c){ c={id:uid(),name,order:S.categories.length}; S.categories.push(c);} return c.id; }
const lastOf = id => { const l = logsOf(id)[0]; return l ? l.doneAt : null; };
// 連続記録：イベントごとの単位（毎日／毎週／毎月）で、記録がある期間が何回続いているか
const UNITS = {
  none:{label:"なし"},
  day:{label:"毎日", unit:"日", cur:"今日", word:"日"},
  week:{label:"毎週", unit:"週", cur:"今週", word:"週"},
  month:{label:"毎月", unit:"か月", cur:"今月", word:"か月"},
};
function periodOf(ms, unit){
  const dn = dayNum(ms);
  if(unit==="week") return Math.floor((dn+3)/7);           // 月曜始まり
  if(unit==="month"){ const [y,m] = dayKey(ms).split("-").map(Number); return y*12+m-1; }
  return dn;
}
function streakOf(id){
  const ev = S.events.find(e=>e.id===id); const unit = ev?.streakUnit || "day";
  if(unit==="none") return {n:0, cur:false, unit};
  const ps = new Set(S.logs.filter(l=>l.eventId===id).map(l=>periodOf(l.doneAt, unit)));
  const now = periodOf(Date.now(), unit);
  let p = ps.has(now) ? now : (ps.has(now-1) ? now-1 : null);
  if(p===null) return {n:0, cur:false, unit};
  let n=0; while(ps.has(p)){ n++; p--; }
  return {n, cur:ps.has(now), unit};
}
const stText = st => `${st.n}${UNITS[st.unit].word}連続`;
const STREAK_MIN = 2;
function addEvent(t, front=true){
  const minOrder = Math.min(0,...S.events.map(e=>e.order));
  const categoryId = t.categoryId!==undefined ? t.categoryId : (t.cat ? ensureCat(t.cat) : null);
  const ev = {id:uid(),name:t.name,emoji:t.emoji,color:t.color,categoryId,streakUnit:t.unit||"day",archived:false,createdAt:Date.now(),order:front?minOrder-1:Date.now()};
  S.events.push(ev); return ev;
}
function addLog(eventId, doneAt=Date.now(), comment="", photo=null, noTime=false){
  const l = {id:uid(),eventId,doneAt,comment,photo,noTime}; S.logs.push(l); return l;
}

/* ---- grid ---- */
function tileHTML(ev){
  const last = lastOf(ev.id), a = agoParts(last);
  const ago = a ? `<span class="ago">${a.n}${a.u?`<small>${a.u}</small>`:""}</span>` : `<span class="ago never">まだ</span>`;
  const st = streakOf(ev.id); const showSt = st.n>=STREAK_MIN;
  const label = `${ev.name}、${a ? (a.u? `前回から${a.n}${a.u}` : "今日やった") : "まだ記録なし"}${showSt?`、${stText(st)}${st.cur?"":`（${UNITS[st.unit].cur}はまだ）`}`:""}`;
  return `<li><button class="tile${a&&a.n==="今日"?" today":""}" type="button" data-id="${ev.id}" style="--tc:var(--t-${ev.color})" aria-label="${esc(label)}">
    <span class="x" data-x="${ev.id}" role="button" aria-label="${esc(ev.name)}をアーカイブまたは削除">×</span>
    ${showSt?`<span class="streak${st.cur?"":" pending"}" aria-hidden="true"><span class="fire">🔥</span>${st.n}${st.unit==="day"?"":`<small>${UNITS[st.unit].unit}</small>`}</span>`:""}<span class="emo" aria-hidden="true">${esc(ev.emoji)}</span><span class="name">${esc(ev.name)}</span>${ago}</button></li>`;
}
function renderGrid(){
  const g = $("#grid");
  const t = curTab(), list = visible();
  g.innerHTML = list.map(tileHTML).join("") + `<li><button class="tile add" type="button" id="addTile"><span class="emo">＋</span>追加</button></li>`;
  const tabs = [{id:"all",name:"すべて",n:active().length}, ...cats().map(c=>({id:c.id,name:c.name,n:active().filter(e=>e.categoryId===c.id).length}))];
  $("#tabs").innerHTML = tabs.map(x=>`<button type="button" role="tab" data-tab="${x.id}" aria-selected="${x.id===t}">${esc(x.name)}<span class="n">${x.n}</span></button>`).join("")
    + `<button type="button" class="tab-add" id="tabAdd" aria-label="カテゴリを管理">＋</button>`;
  const sel = $("#tabs").querySelector('[aria-selected="true"]'); sel && sel.scrollIntoView({block:"nearest",inline:"nearest"});
  const te = $("#tabEmpty"); te.hidden = list.length>0 || t==="all";
  if(!te.hidden) te.textContent = "このカテゴリにはまだイベントがありません。「＋ 追加」で作るか、イベントの編集でカテゴリを変えてください";
  $("#app").classList.toggle("editing", editing);
  $("#editBtn").textContent = editing ? "完了" : "編集";
  $("#editBtn").classList.toggle("on", editing);
  $("#editHint").hidden = !editing;
}

/* tap / long-press / drag */
let press = null;
const LONG = 480, SLOP = 10;
$("#grid").addEventListener("pointerdown", e => {
  const t = e.target.closest(".tile"); if(!t || t.classList.contains("add")) return;
  if(e.target.closest("[data-x]")) return;
  if(e.button && e.button!==0) return;
  press = {el:t,id:t.dataset.id,x:e.clientX,y:e.clientY,moved:false,long:false,pid:e.pointerId};
  if(!editing){
    t.classList.add("pressing");
    press.timer = setTimeout(()=>{ if(!press) return; press.long=true; t.classList.remove("pressing"); if(navigator.vibrate) try{navigator.vibrate(15)}catch(_){} openRecordSheet(press.id); }, LONG);
  }
});
window.addEventListener("pointermove", e => {
  if(!press || e.pointerId!==press.pid) return;
  const dx=e.clientX-press.x, dy=e.clientY-press.y;
  if(!press.moved && Math.hypot(dx,dy)>SLOP){
    press.moved=true; clearTimeout(press.timer); press.el.classList.remove("pressing");
    if(editing) startDrag(e);
  }
  if(press.drag) moveDrag(e);
});
window.addEventListener("pointerup", e => {
  if(!press || e.pointerId!==press.pid) return;
  const p = press; press=null; clearTimeout(p.timer); p.el.classList.remove("pressing");
  if(p.drag){ endDrag(p); return; }
  if(p.moved || p.long) return;
  if(editing) openDetail(p.id); else quickRecord(p.id);
});
window.addEventListener("pointercancel", () => { if(!press) return; clearTimeout(press.timer); press.el.classList.remove("pressing"); if(press.drag) endDrag(press); press=null; });
$("#tabs").addEventListener("click", e => {
  if(e.target.closest("#tabAdd")) return openCatSheet();
  const b = e.target.closest("[data-tab]"); if(!b) return; setTab(b.dataset.tab);
});
function setTab(id){ S.meta.tab=id; save(); renderGrid(); }
function swipeTab(dir){ const ids=["all",...cats().map(c=>c.id)]; const i=ids.indexOf(curTab()); const n=i+dir; if(n<0||n>=ids.length) return;
  setTab(ids[n]); const g=$("#grid"); g.classList.remove("slide-l","slide-r"); void g.offsetWidth; g.classList.add(dir>0?"slide-l":"slide-r"); }
// スワイプでタブ切り替え（編集モード中は無効）
let sw=null;
$("#app").addEventListener("pointerdown", e=>{ if(editing || e.target.closest("#tabs")) return; sw={x:e.clientX,y:e.clientY,t:Date.now()}; });
window.addEventListener("pointerup", e=>{ if(!sw) return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y, dt=Date.now()-sw.t; sw=null;
  if(Math.abs(dx)>60 && Math.abs(dy)<Math.abs(dx)*0.6 && dt<700) swipeTab(dx<0?1:-1); });
$("#grid").addEventListener("contextmenu", e => {
  const t = e.target.closest(".tile"); if(!t || t.classList.contains("add")) return;
  e.preventDefault(); if(press && press.long) return;
  if(press){ clearTimeout(press.timer); press=null; }
  if(!editing) openRecordSheet(t.dataset.id);
});
$("#grid").addEventListener("click", e => {
  if(e.target.closest("#addTile")) return openEventSheet();
  const x = e.target.closest("[data-x]"); if(x){ e.stopPropagation(); return openRemoveSheet(x.dataset.x); }
  // keyboard activation (Enter/Space) produces click with detail 0
  const t = e.target.closest(".tile"); if(t && e.detail===0 && !t.classList.contains("add")){ editing ? openDetail(t.dataset.id) : quickRecord(t.dataset.id); }
});

function startDrag(e){
  const r = press.el.getBoundingClientRect();
  const g = press.el.cloneNode(true); g.classList.add("ghost"); g.style.width=r.width+"px"; g.style.height=r.height+"px";
  document.body.appendChild(g);
  press.drag = {ghost:g, ox:e.clientX-r.left, oy:e.clientY-r.top};
  press.el.classList.add("dragging");
  moveDrag(e);
}
function moveDrag(e){
  const d = press.drag; d.ghost.style.left=(e.clientX-d.ox)+"px"; d.ghost.style.top=(e.clientY-d.oy)+"px";
  d.ghost.style.display="none"; const over = document.elementFromPoint(e.clientX,e.clientY); d.ghost.style.display="";
  const t = over && over.closest(".tile:not(.add)");
  if(t && t.dataset.id!==press.id){
    const list = visible(); const slots = list.map(x=>x.order).sort((a,b)=>a-b);
    const from = list.findIndex(x=>x.id===press.id), to = list.findIndex(x=>x.id===t.dataset.id);
    const [m] = list.splice(from,1); list.splice(to,0,m); list.forEach((x,i)=>x.order=slots[i]);
    renderGrid(); press.el = document.querySelector(`.tile[data-id="${press.id}"]`); press.el.classList.add("dragging");
  }
}
function endDrag(p){ p.drag.ghost.remove(); save(); renderGrid(); }

/* ---- record ---- */
function quickRecord(id){
  const before = streakOf(id);
  const l = addLog(id); save(); renderGrid();
  const after = streakOf(id); const grew = after.n>before.n && after.n>=STREAK_MIN;
  if(grew){ const b=document.querySelector(`.tile[data-id="${id}"] .streak`); b && b.classList.add("burst"); }
  const t = document.querySelector(`.tile[data-id="${id}"]`); if(t){ t.classList.add("pop"); }
  const ev = S.events.find(e=>e.id===id);
  showToast(grew ? `🔥 ${stText(after)}！` : `${ev.emoji} 記録しました`, [
    {label:"取り消す", fn:()=>{ S.logs = S.logs.filter(x=>x.id!==l.id); save(); renderGrid(); showToast("取り消しました"); }},
    grew ? {label:"シェア", fn:()=>openShareSheet(l.id)} : {label:"メモを足す", fn:()=>openRecordSheet(id, l.id)}
  ]);
  if(!S.meta.hintShown){ S.meta.hintShown=true; save(); setTimeout(showHint, 600); }
}
function showHint(){
  const h = document.createElement("div"); h.className="hint"; h.setAttribute("role","status");
  h.innerHTML = `<p>💡 タイルを<b>長押し</b>すると、メモや写真も残せます</p><button class="btn small" type="button">OK</button>`;
  h.querySelector("button").onclick=()=>h.remove(); document.body.appendChild(h); setTimeout(()=>h.remove(),9000);
}
function showToast(msg, actions=[]){
  document.querySelector(".toast")?.remove(); clearTimeout(toastTimer);
  const t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  t.innerHTML = `<p>${esc(msg)}</p>`+actions.map((a,i)=>`<button type="button" data-i="${i}">${esc(a.label)}</button>`).join("")+(actions.length?`<span class="bar5"></span>`:"");
  t.addEventListener("click", e=>{ const b=e.target.closest("[data-i]"); if(!b) return; t.remove(); actions[+b.dataset.i].fn(); });
  document.body.appendChild(t); toastTimer=setTimeout(()=>t.remove(), actions.length?5000:2200);
}

/* ---- sheets ---- */
function openSheet(html, onMount){
  closeSheet();
  const L = $("#layer");
  L.insertAdjacentHTML("beforeend", `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`);
  L.querySelector(".scrim").onclick = closeSheet;
  const sh = L.querySelector(".sheet"); onMount && onMount(sh);
  const f = sh.querySelector("input,textarea,button"); f && f.focus({preventScroll:true});
}
function closeSheet(){ $("#layer").querySelectorAll(".scrim,.sheet").forEach(n=>n.remove()); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if($(".sheet")) closeSheet(); else if($(".panel")) closeDetail(); }});

function resizePhoto(file){
  return new Promise((res,rej)=>{
    const r = new FileReader(); r.onerror=rej;
    r.onload = () => { const img = new Image(); img.onerror=rej; img.onload = () => {
      const max=800, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.78)); }; img.src=r.result; };
    r.readAsDataURL(file);
  });
}

function openRecordSheet(eventId, logId=null, presetDay=null){
  const ev = S.events.find(e=>e.id===eventId); const log = logId ? S.logs.find(l=>l.id===logId) : null;
  let photo = log?.photo || null;
  const tk = todayKey();
  // 初期状態：新規は「今」、日付指定（カレンダーから）や編集は日付モード
  let mode = "now", dVal = tk, tVal = "";
  if(presetDay){ mode="pick"; dVal=presetDay; }
  if(log){ mode="pick"; dVal=dayKey(log.doneAt); const p=parts(log.doneAt); tVal = log.noTime?"":`${p.hour}:${p.minute}`; }
  const chip = (w,label) => `<button type="button" data-w="${w}" role="radio">${label}</button>`;
  openSheet(`
    <h2><span aria-hidden="true">${esc(ev.emoji)}</span>${esc(ev.name)}</h2>
    <form id="recForm">
      <div class="field"><span class="lbl" id="whenL">いつやった？</span>
        <div class="seg" role="radiogroup" aria-labelledby="whenL">${chip("now","今")}${chip("y1","昨日")}${chip("y2","一昨日")}${chip("pick","日付を選ぶ")}</div>
        <div class="pickbox" id="pickBox">
          <div class="pf"><label for="recDate">日付</label><input type="date" id="recDate" value="${dVal}" max="${tk}"></div>
          <div class="pf"><label for="recTime">時刻（わかれば）</label><input type="time" id="recTime" value="${tVal}"></div>
        </div>
        <p class="whenNote" id="whenNote"></p>
      </div>
      <div class="field"><label for="recComment">メモ</label><textarea id="recComment" placeholder="例：新しい洗剤を試した">${esc(log?.comment)}</textarea></div>
      <div class="field"><label for="recPhoto">写真（1枚）</label><input type="file" id="recPhoto" accept="image/*"><div id="photoBox">${photo?`<img class="photo-prev" src="${photo}" alt="添付した写真"><button type="button" class="btn small" id="rmPhoto">写真を外す</button>`:""}</div></div>
      <p class="empty" id="recErr" hidden></p>
      <div class="row"><button class="btn primary" type="submit">${log?"保存する":"やった！を記録"}</button></div>
    </form>
    ${log?"":`<div class="links"><button class="btn" type="button" id="toDetail">履歴・統計を見る</button><button class="btn" type="button" id="toEdit">イベントを編集</button></div>`}
  `, sh => {
    const box = sh.querySelector("#photoBox");
    const bindRm = () => { const b=sh.querySelector("#rmPhoto"); if(b) b.onclick=()=>{ photo=null; box.innerHTML=""; sh.querySelector("#recPhoto").value=""; }; };
    bindRm();
    sh.querySelector("#recPhoto").onchange = async e => { const f=e.target.files[0]; if(!f) return;
      try{ photo = await resizePhoto(f); box.innerHTML=`<img class="photo-prev" src="${photo}" alt="添付した写真"><button type="button" class="btn small" id="rmPhoto">写真を外す</button>`; bindRm(); }
      catch(_){ showToast("この画像は読み込めませんでした。JPEG か PNG を選んでください"); } };
    const dI = sh.querySelector("#recDate"), tI = sh.querySelector("#recTime"), pb = sh.querySelector("#pickBox"), note = sh.querySelector("#whenNote");
    const sync = () => {
      sh.querySelectorAll("[data-w]").forEach(b=>b.setAttribute("aria-checked", b.dataset.w===mode));
      pb.hidden = mode==="now";
      note.textContent = mode==="now" ? "今の時刻で記録します" : `${relDayLabel(dI.value||tk)}${tI.value?" "+tI.value:"（時刻なし）"} として記録します`;
    };
    sh.querySelector(".seg").onclick = e => { const b=e.target.closest("[data-w]"); if(!b) return; mode=b.dataset.w;
      if(mode==="y1") dI.value=shiftDay(tk,-1); if(mode==="y2") dI.value=shiftDay(tk,-2); if(mode==="pick" && !dI.value) dI.value=tk; sync(); };

    sync();
    sh.querySelector("#recForm").onsubmit = e => { e.preventDefault();

        if(d > tk) return fail("未来の日付は記録できません。今日より前の日付を選んでください");
        if(tI.value){ when = fromLocalInput(`${d}T${tI.value}`); if(when > Date.now()+60000) return fail("まだ来ていない時刻です。時刻を直すか、空欄にしてください"); }
        else { when = noonOf(d); noTime = true; }

  });
}

/* ---- share ---- */
function streakAt(eventId, ms){
  const ev = S.events.find(e=>e.id===eventId); const unit = ev?.streakUnit || "day";
  if(unit==="none") return {n:0, unit};
  const ps = new Set(S.logs.filter(l=>l.eventId===eventId && l.doneAt<=ms).map(l=>periodOf(l.doneAt, unit)));
  let p = periodOf(ms, unit), n=0; while(ps.has(p)){ n++; p--; } return {n, unit};
}
function shareInfo(logId){
  const l = S.logs.find(x=>x.id===logId); const ev = S.events.find(e=>e.id===l.eventId);
  const prev = S.logs.filter(x=>x.eventId===ev.id && x.doneAt<l.doneAt).sort((a,b)=>b.doneAt-a.doneAt)[0];
  const gap = prev ? dayNum(l.doneAt)-dayNum(prev.doneAt) : null;
  const st = streakAt(ev.id, l.doneAt);
  const headline = st.n>=STREAK_MIN ? `🔥 ${stText(st)}` : gap===null ? "はじめての記録" : gap===0 ? "今日2回目" : `${gap}日ぶり`;
  const tint = getComputedStyle(document.documentElement).getPropertyValue(`--t-${ev.color}`).trim();
  return {l, ev, st, gap, headline, tint};
}
function wrapText(ctx, text, maxW){ const out=[]; let line=""; for(const ch of text){ if(ctx.measureText(line+ch).width>maxW && line){ out.push(line); line=ch; } else line+=ch; } if(line) out.push(line); return out; }
async function drawShareCard(info, opt){
  try{ await document.fonts.ready; }catch(_){}
  const W=1080, H=1350, c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  const light = ["#FFD9D2","#FFE3C2","#FFF1B8","#D7F0C8","#C9EEE6","#D3E6FF","#E4DAFF","#FFDCEB"];
  const lightMap = {tomato:0,tangerine:1,sun:2,leaf:3,teal:4,sky:5,grape:6,pink:7};
  const bg = light[lightMap[info.ev.color]] || "#EEF1F6";       // シェア画像は常にライト配色で作る
  const ink = "#1B2333", sub = "#4A5568", accent = "#1F6F5C";
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  // 白いカード
  const cx=72, cy=72, cw=W-144, ch=H-144, r=56;
  x.fillStyle="#FFFFFF"; x.beginPath(); x.roundRect(cx,cy,cw,ch,r); x.fill();
  const disp = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif', body='"Zen Kaku Gothic New","Hiragino Sans",sans-serif';
  x.textAlign="center"; x.textBaseline="alphabetic";
  const extra = (opt.photo && info.l.photo) || (opt.memo && info.l.comment);
  let y = opt.photo && info.l.photo ? 250 : extra ? 380 : 450;
  x.font=`${opt.photo&&info.l.photo?150:220}px ${disp}`; x.fillText(info.ev.emoji, W/2, y);
  x.fillStyle=ink; x.font=`800 76px ${disp}`;
  const nameLines = wrapText(x, info.ev.name, cw-140).slice(0,2);
  y += 130; nameLines.forEach(t=>{ x.fillText(t, W/2, y); y+=92; });
  x.fillStyle=accent; x.font=`800 120px ${disp}`; x.fillText("やった！", W/2, y+70); y+=130;
  // 見出し（連続 or ○日ぶり）
  x.font=`800 64px ${disp}`; const hw = x.measureText(info.headline).width+90;
  x.fillStyle=bg; x.beginPath(); x.roundRect(W/2-hw/2, y+10, hw, 104, 52); x.fill();
  x.fillStyle=ink; x.fillText(info.headline, W/2, y+85); y+=150;
  if(opt.photo && info.l.photo){
    const img = await new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=info.l.photo; });
    if(img){ const bw=cw-160, bh=Math.min(360, H-cy-200-y); const sc=Math.max(bw/img.width, bh/img.height);
      x.save(); x.beginPath(); x.roundRect(W/2-bw/2, y, bw, bh, 32); x.clip();
      x.drawImage(img, W/2-img.width*sc/2, y+bh/2-img.height*sc/2, img.width*sc, img.height*sc); x.restore(); y+=bh+30; }
  }
  if(opt.memo && info.l.comment){
    x.fillStyle=sub; x.font=`500 44px ${body}`;
    wrapText(x, info.l.comment.replace(/\s+/g," "), cw-200).slice(0,2).forEach(t=>{ x.fillText(t, W/2, y+40); y+=62; });
  }
  // フッター
  x.fillStyle=sub; x.font=`500 40px ${body}`; x.fillText(fmtWhen(info.l.doneAt, info.l.noTime), W/2, cy+ch-120);
  x.font=`800 44px ${disp}`; const wm1="Yatta", wm2="log"; const w1=x.measureText(wm1).width, w2=x.measureText(wm2).width;
  x.textAlign="left"; x.fillStyle=ink; x.fillText(wm1, W/2-(w1+w2)/2, cy+ch-50); x.fillStyle=accent; x.fillText(wm2, W/2-(w1+w2)/2+w1, cy+ch-50);
  return c;
}
function shareText(info){ return `${info.ev.emoji} ${info.ev.name} やった！ ${info.headline} #Yattalog`; }
function openShareSheet(logId){
  const info = shareInfo(logId); const opt = {memo:false, photo:false};
  openSheet(`<h2>シェア</h2>
    <div class="share-prev"><img id="shareImg" alt="シェア画像のプレビュー"></div>
    <div class="share-opts">
      <label class="check"><input type="checkbox" id="optMemo" ${info.l.comment?"":"disabled"}> メモも載せる${info.l.comment?"":"（メモなし）"}</label>
      <label class="check"><input type="checkbox" id="optPhoto" ${info.l.photo?"":"disabled"}> 写真も載せる${info.l.photo?"":"（写真なし）"}</label>
    </div>
    <p class="whenNote" style="margin:0 0 12px">投稿文：${esc(shareText(info))}</p>
    <div class="row"><button class="btn primary" type="button" id="doShare">共有する（インスタ・Xなど）</button></div>
    <div class="links"><a class="btn" id="xIntent" target="_blank" rel="noopener" href="https://x.com/intent/post?text=${encodeURIComponent(shareText(info))}">X の投稿画面を開く</a></div>
    <p class="empty" id="shareNote" hidden></p>`, async sh => {
    const img = sh.querySelector("#shareImg"); let canvas;
    const redraw = async () => { canvas = await drawShareCard(info, opt); img.src = canvas.toDataURL("image/png"); };
    sh.querySelector("#optMemo").onchange = e => { opt.memo=e.target.checked; redraw(); };
    sh.querySelector("#optPhoto").onchange = e => { opt.photo=e.target.checked; redraw(); };
    await redraw();
    sh.querySelector("#doShare").onclick = async () => {
      const note = sh.querySelector("#shareNote");
      try{
        const blob = await new Promise(r=>canvas.toBlob(r,"image/png"));
        const file = new File([blob], "yattalog.png", {type:"image/png"});
        if(!navigator.canShare || !navigator.canShare({files:[file]})) throw new Error("unsupported");
        await navigator.share({files:[file], text:shareText(info)});
      }catch(err){
        if(err && err.name==="AbortError") return;
        note.hidden=false; note.textContent="この環境では共有シートを開けませんでした。本番（ホーム画面に追加した PWA）では、スマホの共有シートからインスタや X に画像を渡せます。PoC では上のプレビューで見た目を確認してください。";
      }
    };
  });
}

    sh.querySelector("#mReset").onclick = ()=>{ S=fresh(false); save(); closeSheet(); renderGrid(); openOnboarding(true); };
    sh.addEventListener("click", e=>{ const b=e.target.closest("[data-un]"); if(!b) return; const ev=S.events.find(x=>x.id===b.dataset.un); ev.archived=false; ev.order=Math.min(0,...S.events.map(x=>x.order))-1; save(); renderGrid(); openMenu(); });
  });
}

/* ---- onboarding ---- */
function pastLogs(ev, every){
  // お試し用：だいたい every 日ごとの過去記録を、ゆらぎ付きで作る
  let t = Date.now() - (Math.random()*every*1.4+.3)*864e5;
  const start = Date.now() - 760*864e5; let n=0;
  while(t>start && n<400){ addLog(ev.id, t, n===0&&Math.random()<.5?"いつもどおり":""); t -= every*(0.6+Math.random()*0.9)*864e5; n++; }
}
function seedSample(){
  S = fresh(true);
  ["家事","身の回り","趣味"].forEach(ensureCat);
  TEMPLATES.forEach((t,i)=>{ const ev=addEvent(t,false); ev.order=i; pastLogs(ev,t.every); });
  const ev = addEvent({name:"パスポート更新",emoji:"📚",color:"grape",categoryId:null},false); ev.order=99;
  // 連続記録のお試し：水やりは今日まで7日連続、ジムは昨日まで3日連続（今日はまだ）
  const streakDemo = (name, from, to) => { const e=S.events.find(x=>x.name===name); if(!e) return;
    S.logs = S.logs.filter(l=>!(l.eventId===e.id && daysSince(l.doneAt)<=to+1));
    for(let d=from; d<=to; d++) addLog(e.id, noonOf(shiftDay(todayKey(),-d)), "", null, true); };
  streakDemo("植物の水やり", 0, 6); streakDemo("ジム", 1, 3);
  // 毎週：シーツ交換を過去5週、毎月：散髪を過去4か月（今月はまだ）
  const periodDemo = (name, count, stepDays, skipCurrent) => { const e=S.events.find(x=>x.name===name); if(!e) return;
    S.logs = S.logs.filter(l=>l.eventId!==e.id);
    for(let i=skipCurrent?1:0; i<count+(skipCurrent?1:0); i++) addLog(e.id, noonOf(shiftDay(todayKey(), -i*stepDays)), "", null, true); };
  periodDemo("シーツ交換", 5, 7, false); periodDemo("散髪", 4, 30, true);
  // 季節のくせ：エアコン掃除は夏前と冬前、布団干しは春と秋に多い
  const seasonal = (name, weights) => { const e=S.events.find(x=>x.name===name); if(!e) return;
    const keep = S.logs.filter(l=>l.eventId===e.id && daysSince(l.doneAt)<=35); S.logs = S.logs.filter(l=>l.eventId!==e.id).concat(keep);
    for(let d=36; d<760; d++){ const t=Date.now()-d*864e5; const m=+parts(t).month; if(Math.random() < weights[m-1]) addLog(e.id, noonOf(dayKey(t)), "", null, true); } };
  seasonal("エアコンのフィルター掃除", [.01,.01,.01,.02,.06,.12,.10,.08,.02,.02,.04,.06]);
  seasonal("布団を干す", [.04,.06,.16,.2,.18,.06,.04,.04,.12,.18,.16,.05]);
  save();
}
function openOnboarding(first){
  const picked = new Set(first?[0,2,4,8]:[]);
  openSheet(`<h2>${first?"ようこそ！何を記録しますか？":"テンプレートから追加"}</h2>
    <p class="empty" style="margin-bottom:12px">タップで選んで、まとめて追加できます。「家事」「身の回り」「趣味」のカテゴリも自動で作ります。あとから変更できます。</p>
    <div class="tpls">${TEMPLATES.map((t,i)=>`<button type="button" class="tpl" data-t="${i}" aria-pressed="${picked.has(i)}" style="--tc:var(--t-${t.color})"><span class="emo" aria-hidden="true">${t.emoji}</span><span style="min-width:0">${esc(t.name)}</span><span class="chk" aria-hidden="true">✓</span></button>`).join("")}</div>
    <label class="check"><input type="checkbox" id="withPast" checked> お試し用に、過去の記録も入れておく（PoC 専用）</label>
    <div class="row"><button class="btn primary" type="button" id="tplAdd">追加する</button>${first?`<button class="btn" type="button" id="tplSkip">自分で作る</button>`:""}</div>`, sh => {
    sh.querySelector(".tpls").onclick = e => { const b=e.target.closest("[data-t]"); if(!b) return; const i=+b.dataset.t; picked.has(i)?picked.delete(i):picked.add(i); b.setAttribute("aria-pressed", picked.has(i)); };
    sh.querySelector("#tplAdd").onclick = () => {
      const past = sh.querySelector("#withPast").checked;
      ["家事","身の回り","趣味"].filter(n=>[...picked].some(i=>TEMPLATES[i].cat===n)).forEach(ensureCat);
      [...picked].sort((a,b)=>b-a).forEach(i=>{ const ev=addEvent(TEMPLATES[i]); if(past) pastLogs(ev,TEMPLATES[i].every); });
      S.meta.onboarded=true; save(); closeSheet(); renderGrid(); showToast(`${picked.size}件追加しました`);
    };
    sh.querySelector("#tplSkip")?.addEventListener("click", ()=>{ S.meta.onboarded=true; save(); closeSheet(); openEventSheet(); });
  });
}

/* ---- detail ---- */
let detail = null; // {id, ym:[y,m], sel}
function openDetail(id){
  const now = parts(Date.now());
  detail = {id, y:+now.year, m:+now.month, sel:null, sy:+now.year, sAll:false};
  renderDetail();
}
function closeDetail(){ detail=null; document.querySelector(".panel")?.remove(); }
function refreshDetail(){ if(detail && S.events.find(e=>e.id===detail.id)) renderDetail(); }
/* よくやる時期：月別の記録回数（1年分 or 全期間の月別合計） */
function monthRanges(ms){ // [6,7,8,12] -> "6〜8月・12月"
  const out=[]; let a=null,b=null;
  ms.forEach(m=>{ if(a===null){a=b=m;} else if(m===b+1){b=m;} else { out.push(a===b?`${a}月`:`${a}〜${b}月`); a=b=m; } });
  if(a!==null) out.push(a===b?`${a}月`:`${a}〜${b}月`); return out.join("・");
}
function seasonCard(logs){
  if(!logs.length) return "";
  const years = logs.map(l=>+parts(l.doneAt).year); const minY = Math.min(...years), maxY = +parts(Date.now()).year;
  detail.sy = Math.min(Math.max(detail.sy, minY), maxY);
  const all = detail.sAll, Y = detail.sy;
  const counts = Array(12).fill(0);
  logs.forEach(l=>{ const p=parts(l.doneAt); if(all || +p.year===Y) counts[+p.month-1]++; });
  const total = counts.reduce((a,b)=>a+b,0), max = Math.max(...counts);
  // 見出し：最大値の7割以上の月を「よくやる時期」とする（3回未満は判定しない）
  let headline;
  if(total<3) headline = "記録が増えると、よくやる時期がわかります";
  else if(counts.every(c=>c>=max*0.7)) headline = "1年を通して同じくらい";
  else headline = `よくやるのは <b>${monthRanges(counts.map((c,i)=>c>=max*0.7&&c>0?i+1:0).filter(Boolean))}</b>`;
  // 目盛り：上限をきりのいい数に
  const step = max<=4?1:max<=10?2:max<=20?5:max<=50?10:20, top = Math.max(step, Math.ceil(max/step)*step);
  const W=320, H=150, L=22, R=6, T=12, B=22, cw=(W-L-R)/12, bw=Math.min(16, cw*0.56);
  const yv = v => T + (H-T-B)*(1 - v/top);
  let grid=""; for(let v=0; v<=top; v+=step){ const y=yv(v); grid += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="sgrid${v===0?" base":""}"/><text x="${L-6}" y="${y+3.5}" class="sax" text-anchor="end">${v}</text>`; if(top/step>4) v+=step; }
  const nowM = +parts(Date.now()).month, isCur = !all && Y===maxY;
  let bars="", hits="", labels="";
  counts.forEach((c,i)=>{ const x=L+cw*i+cw/2, y=yv(c), h=Math.max(0,(H-B)-y);
    const future = isCur && i+1>nowM;
    if(c>0){ const r=Math.min(4,h); bars += `<path class="sbar${c===max&&total>=3?" peak":""}" data-m="${i+1}" data-v="${c}" d="M${x-bw/2},${H-B} V${y+r} Q${x-bw/2},${y} ${x-bw/2+r},${y} H${x+bw/2-r} Q${x+bw/2},${y} ${x+bw/2},${y+r} V${H-B} Z"/>`; }
    else bars += `<path class="sbar" data-m="${i+1}" data-v="0" d="M${x-bw/2},${H-B} h${bw}"/>`;
    if(c===max && c>0 && total>=3) labels += `<text x="${x}" y="${y-5}" class="sval" text-anchor="middle">${c}</text>`;
    hits += `<rect class="shit" data-m="${i+1}" x="${L+cw*i}" y="${T}" width="${cw}" height="${H-T}" tabindex="0" role="img" aria-label="${i+1}月 ${c}回"/>`;
    labels += `<text x="${x}" y="${H-6}" class="sax${future?" fut":""}" text-anchor="middle">${i+1}</text>`; });
  const yearNav = `<div class="seg2" role="group" aria-label="期間">
      <button type="button" data-sall="0" aria-pressed="${!all}">年ごと</button><button type="button" data-sall="1" aria-pressed="${all}">全期間</button></div>`;
  return `<section class="card season">
    <div class="season-head"><h3 style="margin:0">よくやる時期</h3>${yearNav}</div>
    ${all?`<p class="season-sub">${minY}〜${maxY}年の月別合計（${total}回）</p>`:
      `<div class="cal-head" style="margin:2px 0 0"><button class="iconbtn" type="button" id="syPrev" aria-label="前の年" ${Y<=minY?"disabled":""}>‹</button><strong>${Y}年 <small class="season-n">${total}回</small></strong><button class="iconbtn" type="button" id="syNext" aria-label="次の年" ${Y>=maxY?"disabled":""}>›</button></div>`}
    <p class="season-line">${headline}</p>
    <div class="season-chart" id="season"><span class="season-tip" id="seasonTip" hidden></span>
      <svg viewBox="0 0 ${W} ${H}" role="group" aria-label="月別の記録回数">${grid}${bars}${labels}${hits}</svg></div>
    <table class="sr-only"><caption>${all?"全期間":Y+"年"}の月別記録回数</caption><tr><th>月</th><th>回数</th></tr>${counts.map((c,i)=>`<tr><td>${i+1}月</td><td>${c}</td></tr>`).join("")}</table>
  </section>`;
}
function renderDetail(){
  const ev = S.events.find(e=>e.id===detail.id); if(!ev) return closeDetail();
  const logs = logsOf(ev.id); const last = logs[0]?.doneAt; const a = agoParts(last);
  const thisYear = parts(Date.now()).year;
  const yearCount = logs.filter(l=>parts(l.doneAt).year===thisYear).length;
  let avg = "—";
  if(logs.length>=2){ const asc=[...logs].reverse(); let sum=0; for(let i=1;i<asc.length;i++) sum += (asc[i].doneAt-asc[i-1].doneAt)/864e5; avg = friendlyInterval(sum/(asc.length-1)); }
  // calendar
  const {y,m} = detail; const first = new Date(Date.UTC(y,m-1,1)); const dim = new Date(Date.UTC(y,m,0)).getUTCDate();
  const dow0 = first.getUTCDay(); const marks = new Set(logs.map(l=>dayKey(l.doneAt))); const todayK = dayKey(Date.now());
  let cal = ["日","月","火","水","木","金","土"].map(d=>`<span class="dow">${d}</span>`).join("");
  for(let i=0;i<dow0;i++) cal += `<span class="pad"></span>`;
  for(let d=1; d<=dim; d++){ const k=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    cal += `<button type="button" data-day="${k}" ${k>todayK?"disabled":""} class="${marks.has(k)?"has":""} ${k===todayK?"today":""} ${detail.sel===k?"sel":""}" aria-label="${m}月${d}日${marks.has(k)?"、記録あり":""}">${d}</button>`; }
  const shown = detail.sel ? logs.filter(l=>dayKey(l.doneAt)===detail.sel) : logs;
  const html = `<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(ev.name)}の詳細"><div class="in">
    <header class="bar"><button class="iconbtn" type="button" id="dBack" aria-label="ホームに戻る">←</button><span style="flex:1"></span>
      <button class="pill" type="button" id="dShare" ${logs.length?"":"disabled"}>シェア</button><button class="pill" type="button" id="dEdit">編集</button><button class="iconbtn" type="button" id="dMore" aria-label="アーカイブ・削除">⋯</button></header>
    <section class="hero" style="--tc:var(--t-${ev.color})"><span class="emo" aria-hidden="true">${esc(ev.emoji)}</span>
      <div style="min-width:0"><h2>${esc(ev.name)}</h2><div class="sub">${(()=>{const st=streakOf(ev.id);return st.n>=STREAK_MIN?`🔥 ${stText(st)}${st.cur?"":`（${UNITS[st.unit].cur}はまだ）`} ・ `:""})()}${ev.categoryId?esc(S.categories.find(c=>c.id===ev.categoryId)?.name)+" ・ ":""}${last?"前回 "+fmtWhen(last, logs[0].noTime):"まだ記録がありません"}</div></div>
      <div class="big">${a?`${a.n}${a.u?`<small>${a.u}</small>`:""}`:"—"}</div></section>
    <div class="stats">
      <div class="stat"><div class="k">記録回数</div><div class="v">${logs.length}<small>回</small></div></div>
      <div class="stat"><div class="k">今年</div><div class="v">${yearCount}<small>回</small></div></div>
      <div class="stat"><div class="k">ペース</div><div class="v" style="font-size:14px">${avg}</div></div>
    </div>
    <div class="row" style="margin-bottom:14px"><button class="btn primary" type="button" id="dRec">詳しく記録</button></div>
    ${seasonCard(logs)}
    <section class="card"><div class="cal-head"><button class="iconbtn" type="button" id="calPrev" aria-label="前の月">‹</button><strong>${y}年${m}月</strong><button class="iconbtn" type="button" id="calNext" aria-label="次の月">›</button></div>
      <div class="cal" id="cal">${cal}</div></section>
    <section class="card"><h3>${detail.sel?`${+detail.sel.slice(5,7)}月${+detail.sel.slice(8)}日の記録 <button class="btn small" type="button" id="clrSel">すべて表示</button>`:"記録の履歴"}</h3>
      ${shown.length?`<ul class="logs">${shown.map(l=>`<li><span class="when">${fmtWhen(l.doneAt, l.noTime)}</span><div class="body"><div class="c ${l.comment?"":"empty"}">${l.comment?esc(l.comment):"メモなし"}</div>${l.photo?`<img src="${l.photo}" alt="記録の写真">`:""}</div>
        <div class="ops"><button class="btn small" type="button" data-ls="${l.id}" aria-label="この記録をシェア">シェア</button><button class="btn small" type="button" data-le="${l.id}">編集</button><button class="btn small danger" type="button" data-ld="${l.id}" aria-label="この記録を削除">削除</button></div></li>`).join("")}</ul>`:`<p class="empty">${detail.sel?"この日の記録はありません":"記録はまだありません"}</p>`}
      ${detail.sel?`<div class="row" style="margin-top:10px"><button class="btn primary" type="button" id="recOnDay">${relDayLabel(detail.sel)}に記録する</button></div>`:`<p class="whenNote" style="margin-top:8px">カレンダーの日付をタップすると、その日の分を記録できます</p>`}
    </section></div></div>`;
  const old = document.querySelector(".panel"); const sc = old?.scrollTop||0; old?.remove();
  document.body.insertAdjacentHTML("beforeend", html);
  const P = document.querySelector(".panel"); P.scrollTop = sc;
  P.querySelector("#dBack").onclick = closeDetail;
  P.querySelector("#dEdit").onclick = ()=>openEventSheet(ev.id);
  P.querySelector("#dMore").onclick = ()=>openRemoveSheet(ev.id);
  P.querySelector("#dShare").onclick = ()=>{ if(logs[0]) openShareSheet(logs[0].id); };
  P.querySelector("#dRec").onclick = ()=>openRecordSheet(ev.id);
  P.querySelector("#calPrev").onclick = ()=>{ detail.m--; if(detail.m<1){detail.m=12;detail.y--;} renderDetail(); };
  P.querySelector("#calNext").onclick = ()=>{ detail.m++; if(detail.m>12){detail.m=1;detail.y++;} renderDetail(); };
  P.querySelector("#syPrev")?.addEventListener("click", ()=>{ detail.sy--; renderDetail(); });
  P.querySelector("#syNext")?.addEventListener("click", ()=>{ detail.sy++; renderDetail(); });
  P.querySelectorAll("[data-sall]").forEach(b=>b.onclick=()=>{ detail.sAll = b.dataset.sall==="1"; renderDetail(); });
  const chart = P.querySelector("#season");
  if(chart){ const tip = P.querySelector("#seasonTip");
    const show = b => { P.querySelectorAll(".sbar.on").forEach(x=>x.classList.remove("on")); b.classList.add("on");
      tip.hidden=false; tip.textContent = `${b.dataset.m}月：${b.dataset.v}回`;
      const r = b.getBoundingClientRect(), cr = chart.getBoundingClientRect();
      tip.style.left = Math.min(Math.max(r.left+r.width/2-cr.left, 34), cr.width-34)+"px"; tip.style.top = Math.max(r.top-cr.top-6, 0)+"px"; chart.classList.add("tipping"); };
    chart.querySelectorAll(".shit").forEach(h=>{ const bar = chart.querySelector(`.sbar[data-m="${h.dataset.m}"]`);
      h.addEventListener("pointerenter", ()=>show(bar)); h.addEventListener("click", ()=>show(bar));
      h.addEventListener("focus", ()=>show(bar)); });
    chart.addEventListener("pointerleave", e=>{ if(e.pointerType==="mouse"){ tip.hidden=true; chart.classList.remove("tipping"); P.querySelectorAll(".sbar.on").forEach(x=>x.classList.remove("on")); } });
  }
  P.querySelector("#clrSel")?.addEventListener("click", ()=>{ detail.sel=null; renderDetail(); });
  P.querySelector("#recOnDay")?.addEventListener("click", ()=>openRecordSheet(ev.id, null, detail.sel));
  P.querySelector("#cal").onclick = e => { const b=e.target.closest("[data-day]"); if(!b) return; detail.sel = detail.sel===b.dataset.day?null:b.dataset.day; renderDetail(); };
  P.addEventListener("click", e => {
    const ls=e.target.closest("[data-ls]"); if(ls) return openShareSheet(ls.dataset.ls);
    const le=e.target.closest("[data-le]"); if(le) return openRecordSheet(ev.id, le.dataset.le);
    const ld=e.target.closest("[data-ld]"); if(ld){ const gone=S.logs.find(l=>l.id===ld.dataset.ld); S.logs=S.logs.filter(l=>l.id!==gone.id); save(); renderDetail(); renderGrid();
      showToast("記録を削除しました",[{label:"元に戻す",fn:()=>{ S.logs.push(gone); save(); refreshDetail(); renderGrid(); }}]); }
  });
}

/* ---- boot ---- */
$("#editBtn").onclick = ()=>{ editing=!editing; renderGrid(); };
$("#menuBtn").onclick = openMenu;
renderGrid();
if(!S.meta.onboarded) openOnboarding(true);
setInterval(renderGrid, 60000);
})();
</script>
