{% extends "web/base.html" %}
{% load socialaccount %}
{% block body %}
<main class="login">
  <div class="login-hero">
    <div class="login-tiles" aria-hidden="true">
      <span class="c-sky">🛏️<b>5日</b></span><span class="c-grape">✂️<b>32日</b></span><span class="c-leaf">🪴<b>今日</b></span>
    </div>
    <h1 class="logo logo-lg">Yatta<b>log</b></h1>
    <p class="login-copy">「あれ、前にやったのいつだっけ？」<br>やったら1タップ。<br>前回からの日数がひと目でわかる。</p>
  </div>
  {% if messages %}<ul class="messages">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
  <form method="post" action="{% provider_login_url 'google' %}">
    {% csrf_token %}
    <button class="gbtn" type="submit">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      Google でログイン
    </button>
  </form>
  <p class="login-legal">続けると、利用規約とプライバシーポリシーに同意したことになります。</p>
</main>
{% endblock %}
