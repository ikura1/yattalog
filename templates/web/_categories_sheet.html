<h2>カテゴリ</h2>
{# 一覧は読むだけ。行を押すと編集画面、取っ手（≡）で並べ替え #}
<p class="note">ホーム上部のタブになります。押すと名前や絵文字を変えられます。≡ を押したまま動かすと、並べ替えられます。</p>
<ul class="catlist" data-move-url="{% url 'web:categories' %}">
  {% for r in rows %}
  <li data-id="{{ r.category.id }}">
    <button type="button" class="cat-open" hx-get="{% url 'web:category_edit' r.category.id %}" hx-target="#sheet-body">
      <span class="cat-icon" aria-hidden="true">{{ r.category.emoji|default:"・" }}</span>
      <span class="cat-text"><b>{{ r.category.name }}</b>
        <small>{% if r.count %}<span aria-hidden="true">{{ r.emojis|join:"" }}</span> {{ r.count }}件{% else %}まだイベントはありません{% endif %}</small></span>
    </button>
    <button class="iconbtn cat-handle" type="button" aria-label="「{{ r.category.name }}」を並べ替え（↑↓キーでも動かせます）">≡</button>
  </li>
  {% empty %}<li class="note">まだカテゴリがありません。下の「カテゴリを追加」から作れます。</li>{% endfor %}
</ul>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<div class="row"><button class="btn" type="button" hx-get="{% url 'web:category_new' %}" hx-target="#sheet-body">＋ カテゴリを追加</button></div>
