{% load static %}<!doctype html>
<html lang="ja"{% if user.is_authenticated and user.theme != "auto" %} data-theme="{{ user.theme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  {% if user.is_authenticated and user.theme == "light" %}<meta name="theme-color" content="#EEF1F6">
  {% elif user.is_authenticated and user.theme == "dark" %}<meta name="theme-color" content="#12161E">
  {% else %}<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12161E" media="(prefers-color-scheme: dark)">{% endif %}
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
  <title>{% block title %}Yattalog{% endblock %}</title>
  {% include "web/_meta.html" %}
  <link rel="manifest" href="{% url 'web:manifest' %}">
  <link rel="icon" href="{% static 'icons/favicon.svg' %}" type="image/svg+xml">
  <link rel="icon" href="{% static 'icons/favicon-32.png' %}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
  <meta name="apple-mobile-web-app-title" content="Yattalog">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'vendor/htmx-2.0.4.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block analytics %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'{% if user.is_authenticated and not user.haptics %} data-haptics="0"{% endif %}>
  {% block body %}{% endblock %}
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="シート" tabindex="-1" hidden>
    <div class="grab" aria-hidden="true"></div>
    <div id="sheet-body"></div>
  </div>
  <div id="toast-root" aria-live="polite"></div>
</body>
</html>
