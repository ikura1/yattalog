{# テンプレートの一覧（ホームが空のとき、またはメニューから）。決定 042 #}
<form hx-post="{% url 'web:starters' %}" hx-swap="none" class="starters">
  <ul class="starter-list">
    {% for c in starters %}
    <li><label class="starter c-{{ c.starter.color }}{% if c.added %} added{% endif %}">
      <input type="checkbox" name="starter" value="{{ c.key }}" id="starter-{{ c.key }}"{% if c.added %} disabled{% endif %}>
      <span class="emo" aria-hidden="true">{{ c.starter.emoji }}</span>
      <span class="starter-name">{{ c.starter.name }}</span>
      {% if c.added %}<span class="starter-note">追加済み</span>{% endif %}
    </label></li>
    {% endfor %}
  </ul>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <div class="row">
    <button class="btn primary" type="submit">追加する</button>
    <button class="btn" type="button" hx-get="{% url 'web:event_new' %}" hx-target="#sheet-body">自分で作る</button>
  </div>
  <p class="note gap-t">名前・アイコン・色は、あとから変えられます。</p>
</form>
