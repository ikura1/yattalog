<h2>メニュー</h2>
<ul class="menu">
  <li><button type="button" hx-get="{% url 'web:categories' %}" hx-target="#sheet-body">カテゴリを管理</button></li>
  <li><form method="post" action="{% url 'web:logout' %}">{% csrf_token %}<button type="submit">ログアウト</button></form></li>
</ul>
<h3 class="sub-h">アーカイブ（{{ archived|length }}）</h3>
{% for e in archived %}
<div class="arch"><span aria-hidden="true">{{ e.emoji }}</span><span class="arch-name">{{ e.name }}</span>
  <button class="btn small" type="button" hx-post="{% url 'web:event_restore' e.id %}" hx-swap="none">戻す</button></div>
{% empty %}<p class="note">アーカイブしたイベントはありません</p>{% endfor %}
<p class="note gap">タイムゾーン：{{ user_tz }}　・　α 版</p>
