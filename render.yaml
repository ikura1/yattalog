# Render Blueprint（決定 005）。Dashboard の「New → Blueprint」でこのリポジトリを選ぶと作成される
services:
  - type: web
    name: yattalog
    runtime: python
    plan: starter
    region: singapore
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev &&
      uv run python manage.py collectstatic --noinput
    preDeployCommand: uv run python manage.py migrate --noinput
    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 30
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ADMIN_URL
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yattalog-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: yattalog-db
    plan: basic-256mb
    region: singapore
    databaseName: yattalog
    user: yattalog
