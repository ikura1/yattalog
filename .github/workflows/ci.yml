name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yattalog
          POSTGRES_PASSWORD: yattalog
          POSTGRES_DB: yattalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yattalog" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://yattalog:yattalog@localhost:5432/yattalog
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Test (PostgreSQL)
        run: |
          set -o pipefail
          uv run pytest -rfE 2>&1 | tee pytest.log
      - name: Report test failures as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR) |^E  " pytest.log | head -40 | sed 's/^/::error title=pytest::/' || true
      - name: Deploy check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-not-secret-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.com
        run: uv run python manage.py check --deploy --fail-level WARNING

  e2e:
    # ブラウザで JS の振る舞い（楽観的更新・取り消し・失敗時の巻き戻し）を確かめる（レビュー2回目 #4）
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run playwright install chromium --with-deps
      - name: E2E
        run: |
          set -o pipefail
          uv run pytest -m e2e -rfE --tracing retain-on-failure 2>&1 | tee pytest.log
      - name: Report test failures as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR) |^E  " pytest.log | head -40 | sed 's/^/::error title=e2e::/' || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (Cloud Run 用の Dockerfile が壊れていないか確認する)
        run: docker build -t yattalog:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 \
            -e DJANGO_SECRET_KEY=ci-only -e DATABASE_URL=sqlite:////tmp/db.sqlite3 -e DJANGO_ALLOWED_HOSTS=localhost \
            yattalog:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Forwarded-Proto: https" http://localhost:8080/static/js/app.js || true)
            [ "$code" = "200" ] && break; sleep 1
          done
          docker logs app
          test "$code" = "200"
