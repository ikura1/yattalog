# 本番が応答しているかを1時間ごとに確かめる（決定 046）。落ちていたら Issue（ラベル ops）を開く。
# あわせて Discord にも知らせる（Secret の OPS_WEBHOOK_URL があるときだけ、決定 067）。
# /health は DB に触れないので、Neon は起こさない。
name: Uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  APP_URL: ${{ vars.APP_URL || 'https://yattalog-332057063162.asia-southeast1.run.app' }}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /health（コールドスタートを見込んで3回まで試す）
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL/health" || true)
            [ "$code" = "200" ] && exit 0
            echo "試行 $i：HTTP $code"
            sleep 20
          done
          echo "::error title=uptime::/health が 200 を返さない（最後の応答：HTTP $code）"
          exit 1

      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ops --color B60205 --description "本番の監視が見つけたもの（決定 046）" --force
          title="本番に繋がらない（死活監視）"
          n=$(gh issue list --label ops --state open --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          body="$(date -u +%FT%TZ) に /health が応答しませんでした。$RUN_URL"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --label ops --body "$body"; fi

      # 通知は、落ちたときだけ。ふだんの1時間ごとの確認では、リポジトリを取ってこない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: failure()
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: failure()
      - name: Notify（Discord に知らせる）
        if: failure()
        env:
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --no-dev python -m apps.core.ops_notify \
            --message "🚨 Yattalog：本番に繋がりません（/health が応答しない）。$RUN_URL"
