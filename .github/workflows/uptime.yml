# 本番が応答しているかを1時間ごとに確かめる（決定 041）。落ちていたら Issue（ラベル ops）を開く。
# /healthz は DB に触れないので、Neon は起こさない。
name: Uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  APP_URL: ${{ vars.APP_URL || 'https://yattalog-332057063162.asia-southeast1.run.app' }}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /healthz（コールドスタートを見込んで3回まで試す）
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL/healthz" || true)
            [ "$code" = "200" ] && exit 0
            echo "試行 $i：HTTP $code"
            sleep 20
          done
          echo "::error title=uptime::/healthz が 200 を返さない（最後の応答：HTTP $code）"
          exit 1

      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ops --color B60205 --description "本番の監視が見つけたもの（決定 041）" --force
          title="本番に繋がらない（死活監視）"
          n=$(gh issue list --label ops --state open --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          body="$(date -u +%FT%TZ) に /healthz が応答しませんでした。$RUN_URL"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --label ops --body "$body"; fi
