# 依存しているものの更新と、脆弱性の修正を PR で知らせる（レビュー S12）。
# Actions はコミット ID で固定しているので、更新はここからの PR で取り込む。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Python の 3.14 → 3.15 のような上げ方は、ライブラリの対応を確かめてから、.python-version・CI と一緒に手で行う。
    # ここで上げると Dockerfile だけが変わり、ビルドが止まる（2026-11-01 の #144）。修正版（3.14.x）は、ビルドのたびに取り込まれる
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
